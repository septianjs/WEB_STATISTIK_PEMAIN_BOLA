<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#bgGrad)" />
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,4" />
  <!-- Glow Captain Badge -->
  <circle cx="160" cy="40" r="22" fill="#F59E0B" />
  <text x="160" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#1e1b4b" text-anchor="middle">C</text>
  <!-- Player Silhouette -->
  <path d="M100 45 a25 25 0 1 0 0.1 0 Z" fill="url(#goldGrad)" />
  <path d="M55 160 C55 120 75 105 100 105 C125 105 145 120 145 160 Z" fill="url(#goldGrad)" opacity="0.9" />
  <!-- Jersey Number 10 -->
  <text x="100" y="145" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" fill="#0f172a" text-anchor="middle">10</text>
  <!-- Star icon -->
  <polygon points="100,16 103,24 112,24 105,29 107,37 100,32 93,37 95,29 88,24 97,24" fill="#FBBF24" />
</svg>
